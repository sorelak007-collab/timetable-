<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h2>Create an Account</h2>

    <!-- The form tag wraps all input elements -->
    <form action="/submit-form-endpoint" method="POST">
        
        <!-- 1. Text Input Field -->
        <div>
            <label for="fullName">Full Name:</label><br>
            <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
        </div>
        <br>

        <!-- 2. Email Input Field -->
        <div>
            <label for="userEmail">Email Address:</label><br>
            <input type="email" id="userEmail" name="userEmail" placeholder="name@example.com" required>
        </div>
        <br>

        <!-- 3. Password Input Field -->
        <div>
            <label for="userPassword">Password:</label><br>
            <input type="password" id="userPassword" name="userPassword" minlength="8" required>
        </div>
        <br>

        <!-- 4. Radio Buttons (Select only one option) -->
        <div>
            <label>Account Type:</label><br>
            <input type="radio" id="personal" name="accountType" value="personal" checked>
            <label for="personal">Personal</label><br>
            
            <input type="radio" id="business" name="accountType" value="business">
            <label for="business">Business</label>
        </div>
        <br>

        <!-- 5. Dropdown Selection Menu -->
        <div>
            <label for="country">Country:</label><br>
            <select id="country" name="country">
                <option value="us">United States</option>
                <option value="ca">Canada</option>
                <option value="uk">United Kingdom</option>
                <option value="au">Australia</option>
            </select>
        </div>
        <br>

        <!-- 6. Checkbox (Toggle choice) -->
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">Subscribe to newsletter</label>
        </div>
        <br>

        <!-- 7. Submit Button -->
        <div>
            <button type="submit">Register Now</button>
        </div>

    </form>

</body>
</html>
